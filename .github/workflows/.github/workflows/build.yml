name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Dar permissão ao gradlew
        run: chmod +x gradlew
      - name: Compilar
        run: ./gradlew build
      - name: Salvar o mod pronto
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/libs/*.jar
